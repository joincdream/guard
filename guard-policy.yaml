version: "1.0"
rules:
  # 1. DEV 모드 (Cleanroom): 테스트 파일 열람 차단
  - name: "guard-test-files-read"
    mode: "DEV"
    type: "read"
    patterns:
      - "*_test.go"
      - "*.test.ts"
      - "*.test.js"
      - "*.spec.ts"
      - "*.spec.js"
      - "**/testutil/**"
      - "**/tests/**"
      - "**/000/**"
    message: "[POLICY VIOLATION] 당신은 테스트 파일(*_test.go 등)에 접근할 권한이 없습니다. 어떤 우회 시도(Python 스크립트 작성, 와일드카드 덤프, 셸 명령어 조작 등)도 엄격히 금지됩니다. 접근 시도를 즉시 중단하고, 요구사항 명세서와 'go test' 실행 결과(stdout)만을 참조하여 개발을 완료하십시오."

  # 2. PLAN 모드: 프로덕션 소스 코드 임의 수정 차단
  - name: "guard-source-code-write"
    mode: "PLAN"
    type: "write"
    patterns:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/web/**"
      - "src/docker/**"
    message: "[POLICY VIOLATION] 설계(PLAN) 모드에서는 소스 코드 및 인프라 파일(src/internal, src/cmd, src/web, src/docker)을 수정할 수 없습니다. 작업 계획서 및 문서 파일만 작성하십시오."

  # 3. TEST 모드: 프로덕션 코드 열람 차단 (단위 테스트 파일은 예외 허용)
  - name: "guard-production-code-read"
    mode: "TEST"
    type: "read"
    patterns:
      - "src/internal/**"
      - "src/cmd/**"
    exclude_patterns:
      - "*_test.go"
      - "*.test.ts"
      - "*.test.js"
      - "*.spec.ts"
      - "*.spec.js"
      - "**/testutil/**"
      - "**/contract/**"
    message: "[POLICY VIOLATION] TEST 모드에서는 프로덕션 코드(src/internal/, src/cmd/)를 열람할 수 없습니다. 계약(src/contract/) 및 테스트 파일(*_test.go)만 허용됩니다."
